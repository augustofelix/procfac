# Configuración general de la aplicación.
# Usuarios, contraseñas y API key de Claude van en .env (ver .env.example).

[backend]
host = 127.0.0.1
port = 8000

[ui]
# URL con la que la UI de Streamlit llama al backend
backend_url = http://127.0.0.1:8000
port = 8501

[claude]
model = claude-sonnet-5-5
# Segundos de espera de la respuesta antes de cancelar, sin reintentos (RF-26)
timeout_segundos = 60

[pdf]
# Páginas máximas admitidas por PDF (RF-28)
max_paginas = 3
