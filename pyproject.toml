[project]
name = "procfac"
version = "0.1.0"
description = "Extrae facturas A en PDF nativo a un JSON estandarizado"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.15.0",
    "fastapi>=0.150.0",
    "httpx>=0.28.1",
    "pdfplumber>=0.11.10",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
